# ============================================================
# nginx.conf — Reverse Proxy for Legal AI Platform
# ============================================================
# Key features:
#   • WebSocket support (required for Gradio's real-time features)
#   • Rate limiting to prevent abuse
#   • Security headers
#   • Gzip compression
#   • 50MB upload limit (for PDF files)
#   • SSL-ready configuration (commented, easy to enable)
# ============================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging Format ───────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    # ── Performance ──────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ── Gzip Compression ─────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript;

    # ── Rate Limiting ────────────────────────────────────────
    # 10 requests/second per IP — prevents API abuse
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # ── Upload Size ──────────────────────────────────────────
    # Allow up to 50MB uploads (for legal PDF files)
    client_max_body_size 50m;

    # ── Upstream (Gradio App) ────────────────────────────────
    upstream gradio_app {
        server app:10000;
        # For multi-instance scaling:
        # server app_1:10000;
        # server app_2:10000;
    }

    # ── HTTP Server ──────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # ── Security Headers ─────────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── Health Check (no rate limit) ─────────────────────
        location /health {
            proxy_pass http://gradio_app/health;
            access_log off;  # Don't log health checks
        }

        location /ready {
            proxy_pass http://gradio_app/ready;
            access_log off;
        }

        # ── Main App (with rate limiting) ────────────────────
        location / {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://gradio_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # ── WebSocket Support (required for Gradio) ──────
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # ── Timeouts ─────────────────────────────────────
            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            # ── Buffering ────────────────────────────────────
            proxy_buffering off;
            proxy_cache off;
        }

        # ── Deny access to hidden files ──────────────────────
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # ── HTTPS Server (uncomment when SSL is ready) ───────────
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     ssl_certificate /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #
    #     # Same location blocks as above...
    #     location / {
    #         proxy_pass http://gradio_app;
    #         # ... copy all proxy settings from HTTP block
    #     }
    # }
    #
    # # Redirect HTTP to HTTPS
    # server {
    #     listen 80;
    #     server_name your-domain.com;
    #     return 301 https://$server_name$request_uri;
    # }
}
