# Render Blueprint — Legal AI Platform Deployment
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: legal-ai-platform
    runtime: python
    region: oregon
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "python app.py"
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: PORT
        value: "10000"
      - key: APP_ENV
        value: "production"
      - key: PYTHON_VERSION
        value: "3.11.0"
