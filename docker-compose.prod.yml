# ============================================================
# docker-compose.prod.yml — Production Overrides
# ============================================================
# Usage (layered on top of base compose):
#   docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This adds:
#   • Nginx reverse proxy on port 80
#   • Production environment variables
#   • Stricter resource limits
#   • JSON logging driver
# ============================================================

services:

  # ── App overrides for production ─────────────────────────
  app:
    environment:
      - APP_ENV=production
      - LOG_LEVEL=WARNING
    restart: always

    # In production, app is behind Nginx — don't expose directly
    ports: []

    # JSON logging for CloudWatch/ELK integration
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

  # ── Nginx Reverse Proxy ──────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: legal-ai-nginx
    restart: always

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Uncomment for SSL:
      # - ./nginx/ssl:/etc/nginx/ssl:ro

    depends_on:
      app:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
