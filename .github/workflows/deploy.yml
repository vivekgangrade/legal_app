# ============================================================
# GitHub Actions — CI/CD Pipeline for Legal AI Platform
# ============================================================
# Trigger: Push to main branch
#
# Jobs:
#   1. lint-and-test  → Syntax check, flake8 lint
#   2. build-docker   → Build Docker image, push to registry
#   3. deploy         → SSH into EC2, pull & restart containers
#
# Required GitHub Secrets:
#   EC2_HOST          → Public IP or DNS of your EC2 instance
#   EC2_USER          → SSH username (default: ubuntu)
#   EC2_SSH_KEY       → Private SSH key (PEM format)
#   GROQ_API_KEY      → Groq API key
#   TAVILY_API_KEY    → Tavily API key
#   DOCKERHUB_USER    → Docker Hub username (optional)
#   DOCKERHUB_TOKEN   → Docker Hub access token (optional)
# ============================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOCKER_IMAGE: legal-ai-platform
  PYTHON_VERSION: "3.11"

jobs:

  # ── Job 1: Lint & Test ───────────────────────────────────
  lint-and-test:
    name: 🔍 Lint & Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install -r requirements.txt

      - name: Python syntax check
        run: |
          python -c "
          import ast, sys, pathlib
          errors = []
          for f in pathlib.Path('.').rglob('*.py'):
              try:
                  ast.parse(f.read_text(encoding='utf-8'))
              except SyntaxError as e:
                  errors.append(f'{f}: {e}')
          if errors:
              print('Syntax errors found:')
              for e in errors: print(f'  {e}')
              sys.exit(1)
          print('✅ All Python files pass syntax check')
          "

      - name: Flake8 lint
        run: |
          # Stop the build if there are critical Python syntax errors
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warnings (non-blocking)
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

  # ── Job 2: Build Docker Image ────────────────────────────
  build-docker:
    name: 🐳 Build Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Optional: Push to Docker Hub (uncomment if using registry)
      # - name: Login to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USER }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false  # Set to true when pushing to registry
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test container starts
        run: |
          docker run -d --name test-app \
            -e GROQ_API_KEY=test \
            -e TAVILY_API_KEY=test \
            -e APP_ENV=development \
            -p 10000:10000 \
            ${{ env.DOCKER_IMAGE }}:latest

          # Wait for container to start
          sleep 10

          # Check container is running
          docker ps | grep test-app
          docker logs test-app

          # Cleanup
          docker stop test-app
          docker rm test-app

  # ── Job 3: Deploy to AWS EC2 ─────────────────────────────
  deploy:
    name: 🚀 Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "📦 Navigating to app directory..."
            cd /home/${{ secrets.EC2_USER }}/legal-ai-platform

            echo "📥 Pulling latest code..."
            git pull origin main

            echo "📝 Updating environment variables..."
            cat > .env << EOF
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}
            APP_ENV=production
            PORT=10000
            LOG_LEVEL=WARNING
            API_TIMEOUT=30
            WORKERS=1
            EOF

            echo "🔨 Rebuilding containers..."
            docker-compose -f docker-compose.yml -f docker-compose.prod.yml build --no-cache

            echo "🚀 Starting services..."
            docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

            echo "⏳ Waiting for health check..."
            sleep 15

            echo "✅ Health check..."
            curl -f http://localhost:10000/health || echo "Health check pending..."

            echo "🎉 Deployment complete!"
            docker-compose ps
