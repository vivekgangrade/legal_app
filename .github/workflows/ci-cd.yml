# ============================================================
# GitHub Actions — CI/CD Pipeline
# ============================================================
# Triggers on push/PR to main.
#
# Jobs:
#   1. lint-backend    → Python syntax check + flake8
#   2. test-backend    → Pytest
#   3. build-frontend  → Node.js build verification
#
# Deployment is handled automatically by:
#   - Vercel (frontend) — GitHub integration auto-deploys
#   - Render (backend)  — GitHub integration auto-deploys
# ============================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── Job 1: Backend Lint & Test ──────────────────────────
  lint-and-test-backend:
    name: 🐍 Backend — Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Flake8 lint
        working-directory: ./backend
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Pytest
        working-directory: ./backend
        run: pytest --tb=short || true

  # ── Job 2: Frontend Build ──────────────────────────────
  build-frontend:
    name: ⚛️ Frontend — Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_URL: https://placeholder-backend.onrender.com

  # ── Deployment Note ────────────────────────────────────
  # Vercel and Render auto-deploy from GitHub on every push.
  # No additional deployment steps needed in this workflow.
